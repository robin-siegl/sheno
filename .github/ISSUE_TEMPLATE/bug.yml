name: Bug report
description: Report a problem with Sheno
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the issue and what you expected. Please omit personal medication details and identifiers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sheno version
      description: Include whether this is a dev or production build.
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
